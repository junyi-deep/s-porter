name: s-porter-test

services:
  ssh:
    build:
      context: docker/test/ssh
    expose:
      - "22"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      timeout: 2s
      retries: 20

  nginx:
    image: nginx:1.29-alpine
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 20

  proxy:
    build:
      context: docker/test/proxy
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - edge
      - backend
    depends_on:
      ssh:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 && nc -z 127.0.0.1 8888"]
      interval: 2s
      timeout: 2s
      retries: 20

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
